name: stress_app
description: "Clasificación automática de estrés via señales fisiológicas E4"
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.1
  dio: ^5.4.3

  # Archivos
  file_picker: ^8.0.3

  # BLE
  flutter_blue_plus: ^1.31.15

  # Gráficas
  fl_chart: ^0.68.0

  # Estado
  provider: ^6.1.2

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  shimmer: ^3.0.0

  # WebSocket
  web_socket_channel: ^3.0.1

  # Utilidades
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  tflite_flutter: ^0.12.1
  mobile_scanner: ^5.0.0
  archive: ^3.4.10
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/macs_icon_bg.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/macs_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
